name: redis-commander-test

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --databases
      - "32"
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - ./seed.lua:/opt/redis-commander/seed.lua:ro
      - ./seed-container.sh:/opt/redis-commander/seed-container.sh:ro
